openapi: 3.0.3
info:
  title: AD SCD Backend API
  version: 0.1.0
  description: Authentication, storage, patient, assessment, statistics, report, and system APIs.
servers:
  - url: http://localhost:3000/api/v1
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service status
  /auth/web/login:
    post:
      summary: Web username/password login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200": { description: Login succeeded }
        "401": { description: Invalid credentials }
  /auth/me:
    get:
      summary: Get current user
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current user }
        "401": { description: Missing or invalid token }
  /auth/logout:
    post:
      summary: Revoke current token
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Logout succeeded }
  /system/admin-check:
    get:
      summary: Verify administrator permission
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Authorized }
        "403": { description: Permission denied }
  /files:
    get:
      summary: List file metadata
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: relatedType
          schema: { type: string, enum: [scale_config, assessment, patient, report] }
        - in: query
          name: relatedId
          schema: { type: string }
      responses:
        "200": { description: File metadata list }
    post:
      summary: Upload a file
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [originalName, mimeType, relatedType, relatedId, contentBase64]
              properties:
                originalName: { type: string }
                mimeType: { type: string }
                relatedType: { type: string, enum: [scale_config, assessment, patient, report] }
                relatedId: { type: string }
                contentBase64: { type: string }
      responses:
        "201": { description: File created }
        "400": { description: Invalid file or metadata }
  /files/{fileId}:
    get:
      summary: Get file metadata
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: fileId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: File metadata }
        "404": { description: File not found }
  /files/{fileId}/download:
    get:
      summary: Download file bytes
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: fileId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Binary file }
        "404": { description: File not found }
  /scales:
    get:
      summary: List scale configurations
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Scale configuration summaries }
  /scales/{scaleCode}:
    get:
      summary: Get a scale configuration
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: scaleCode, required: true, schema: { type: string } }
      responses:
        "200": { description: Questions, options, and scoring metadata }
        "404": { description: Scale not found }
  /patients:
    get:
      summary: Search patients
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { in: query, name: keyword, schema: { type: string } }
        - { in: query, name: gender, schema: { type: string, enum: [male, female, unknown] } }
        - { in: query, name: status, schema: { type: string, enum: [active, archived] } }
      responses:
        "200": { description: Paginated patients }
    post:
      summary: Create patient
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatientInput" }
      responses:
        "201": { description: Patient created }
        "409": { description: Patient code already exists }
  /patients/{patientId}:
    get:
      summary: Get patient details
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: patientId, required: true, schema: { type: string } }
      responses:
        "200": { description: Patient details }
    patch:
      summary: Update patient
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: patientId, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatientInput" }
      responses:
        "200": { description: Patient updated }
    delete:
      summary: Delete patient without assessments
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: patientId, required: true, schema: { type: string } }
      responses:
        "200": { description: Patient deleted }
        "409": { description: Archive required because assessments exist }
  /assessments:
    get:
      summary: Search assessment records
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: patientId, schema: { type: string } }
        - { in: query, name: scaleCode, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        "200": { description: Paginated assessments }
    post:
      summary: Create or submit assessment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentInput" }
      responses:
        "201": { description: Assessment saved and scored when supported }
  /assessments/{assessmentId}:
    get:
      summary: Get assessment, answers, and patient
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: assessmentId, required: true, schema: { type: string } }
      responses:
        "200": { description: Assessment details }
        "404": { description: Assessment not found }
  /statistics/overview:
    get:
      summary: Dashboard totals and abnormal ratio
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Overview statistics }
  /statistics/score-distribution:
    get:
      summary: Score distribution for ECharts
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: scaleCode, schema: { type: string } }
      responses:
        "200": { description: Score/count points }
  /reports/assessments/{assessmentId}.pdf:
    get:
      summary: Export one assessment report as PDF
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: assessmentId, required: true, schema: { type: string } }
      responses:
        "200":
          description: PDF report
          content:
            application/pdf: {}
  /reports/assessments.xls:
    get:
      summary: Export filtered assessments for Excel
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: SpreadsheetML workbook
          content:
            application/vnd.ms-excel: {}
  /system/accounts:
    get:
      summary: List accounts
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Accounts without password hashes }
    post:
      summary: Create account
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Account created }
  /system/accounts/{userId}:
    patch:
      summary: Update account roles, status, or display name
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string } }
      responses:
        "200": { description: Account updated }
  /system/password:
    put:
      summary: Change current password and revoke sessions
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Password changed }
  /system/operation-logs:
    get:
      summary: Search operation logs
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Paginated operation logs }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    PatientInput:
      type: object
      required: [patientCode, name]
      properties:
        patientCode: { type: string }
        name: { type: string }
        gender: { type: string, nullable: true, enum: [male, female, unknown] }
        birthDate: { type: string, nullable: true, format: date }
        educationYears: { type: number, nullable: true, minimum: 0, maximum: 40 }
        idNumberCiphertext: { type: string, nullable: true }
        phoneCiphertext: { type: string, nullable: true }
        profile: { type: object }
        status: { type: string, enum: [active, archived] }
    AssessmentInput:
      type: object
      required: [patientId, scaleCode, answers]
      properties:
        patientId: { type: string }
        scaleCode: { type: string }
        scaleVersion: { type: string }
        status: { type: string, enum: [draft, in_progress, submitted] }
        durationSeconds: { type: number }
        answers:
          type: array
          items:
            type: object
            required: [itemCode]
            properties:
              itemCode: { type: string }
              optionCode: { type: string, nullable: true }
              answerStatus: { type: string, enum: [answered, unanswered, na, unknown, refused] }
              value: { type: object }
              observation: { type: object }
